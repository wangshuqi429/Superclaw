services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superclaw
      POSTGRES_USER: superclaw
      POSTGRES_PASSWORD: superclaw-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superclaw"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  superclaw:
    build: .
    ports:
      - "8080:8080"
    environment:
      SUPERCLAW_HOST: 0.0.0.0
      SUPERCLAW_DATABASE_URL: postgresql://superclaw:superclaw-local@postgres:5432/superclaw
      SUPERCLAW_REDIS_URL: redis://redis:6379/0
      SUPERCLAW_ASYNC_WORKERS: 4
      SUPERCLAW_SKILLS_DIR: /app/skills
      SUPERCLAW_AUTH_REQUIRED: "true"
      SUPERCLAW_AUTH_SECRET: ${SUPERCLAW_AUTH_SECRET:-local-only-change-this-secret-123456}
      SUPERCLAW_BOOTSTRAP_ADMIN_USERNAME: ${SUPERCLAW_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SUPERCLAW_BOOTSTRAP_ADMIN_PASSWORD: ${SUPERCLAW_BOOTSTRAP_ADMIN_PASSWORD:-superclaw-local-admin}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
